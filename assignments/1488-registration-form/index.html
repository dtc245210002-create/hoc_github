<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký người dùng</title></head>
<body>
  <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
    <p><label for="name"><b>Họ và tên:</b></label><br><input type="text" id="name" name="name"></p>
    <p><label for="email"><b>Email:</b></label><br><input type="email" id="email" name="email"></p>
    <p><label for="phone"><b>Số điện thoại:</b></label><br><input type="tel" id="phone" name="phone"></p>
    <p><b>Giới tính:</b><br><label><input type="radio" name="gender" value="male" checked> Nam</label> <label><input type="radio" name="gender" value="female"> Nữ</label></p>
    <button type="submit">Đăng ký</button>
  </form>
</body>
</html>
