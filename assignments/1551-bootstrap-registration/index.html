<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng ký</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body>
  <main class="container py-4"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6">
    <h1 class="text-center mb-4">Đăng ký</h1>
    <form method="post">
      <div class="mb-3"><label for="fullname" class="form-label text-muted">Họ và tên</label><input id="fullname" name="fullname" class="form-control" type="text" autocomplete="name" required></div>
      <div class="mb-3"><label for="email" class="form-label text-muted">Email</label><input id="email" name="email" class="form-control" type="email" autocomplete="email" required></div>
      <div class="mb-3"><label for="password" class="form-label text-muted">Mật khẩu</label><input id="password" name="password" class="form-control" type="password" autocomplete="new-password" required></div>
      <div class="mb-3"><label for="confirm-password" class="form-label text-muted">Xác nhận mật khẩu</label><input id="confirm-password" name="confirm_password" class="form-control" type="password" autocomplete="new-password" required></div>
      <fieldset class="mb-3"><legend class="fs-6 text-muted">Giới tính</legend>
        <div class="form-check form-check-inline"><input class="form-check-input" id="male" name="gender" type="radio" value="male" required><label class="form-check-label" for="male">Nam</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" id="female" name="gender" type="radio" value="female"><label class="form-check-label" for="female">Nữ</label></div>
        <div class="form-check form-check-inline"><input class="form-check-input" id="other" name="gender" type="radio" value="other"><label class="form-check-label" for="other">Khác</label></div>
      </fieldset>
      <fieldset class="mb-3"><legend class="fs-6 text-muted">Sở thích</legend>
        <div class="form-check"><input class="form-check-input" id="music" name="hobbies" type="checkbox" value="music"><label class="form-check-label" for="music">Âm nhạc</label></div>
        <div class="form-check"><input class="form-check-input" id="sports" name="hobbies" type="checkbox" value="sports"><label class="form-check-label" for="sports">Thể thao</label></div>
        <div class="form-check"><input class="form-check-input" id="reading" name="hobbies" type="checkbox" value="reading"><label class="form-check-label" for="reading">Đọc sách</label></div>
      </fieldset>
      <div class="mb-3"><label for="country" class="form-label text-muted">Quốc gia</label><select id="country" name="country" class="form-select"><option value="VN">Việt Nam</option><option value="JP">Nhật Bản</option><option value="US">Hoa Kỳ</option></select></div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div></div></main>
</body>
</html>
