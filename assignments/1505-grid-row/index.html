<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Grid Row</title><link rel="stylesheet" href="style.css"></head>
<body>
<h2>grid-row: 1 / 3</h2>
<div class="grid-container first"><div class="item item1">Ô 1</div><div class="item">Ô 2</div><div class="item">Ô 3</div><div class="item">Ô 4</div><div class="item">Ô 5</div><div class="item">Ô 6</div></div>
<h2>grid-row: 2 / 4</h2>
<div class="grid-container second"><div class="item item1">Ô 1</div><div class="item">Ô 2</div><div class="item">Ô 3</div><div class="item">Ô 4</div><div class="item">Ô 5</div><div class="item">Ô 6</div></div>
<h2>grid-row: span 2</h2>
<div class="grid-container span"><div class="item item1">Ô 1</div><div class="item">Ô 2</div><div class="item">Ô 3</div><div class="item">Ô 4</div><div class="item">Ô 5</div><div class="item">Ô 6</div></div>
</body>
</html>
