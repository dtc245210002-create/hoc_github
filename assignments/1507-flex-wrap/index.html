<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>flex-wrap</title><link rel="stylesheet" href="style.css"></head>
<body>
<h2>flex-wrap: nowrap</h2>
<div class="container nowrap"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div><div class="item">6</div></div>
<h2>flex-wrap: wrap</h2>
<div class="container wrap"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div><div class="item">6</div></div>
<h2>flex-wrap: wrap-reverse</h2>
<div class="container wrap-reverse"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div><div class="item">6</div></div>
<h2>flex-wrap: initial</h2>
<div class="container initial"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div><div class="item">6</div></div>
</body>
</html>
