<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu iPhone Air</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>
<body>
  <main>
    <section class="bg-light py-5 text-center">
      <div class="container">
        <h1 class="display-3 fw-bold">iPhone Air</h1>
        <p class="lead mb-4">Thiết kế mỏng nhẹ. Hiệu năng mạnh mẽ.</p>
        <div class="d-flex justify-content-center gap-3 flex-wrap mb-5">
          <a class="btn btn-primary rounded-pill px-4" href="#features">Khám phá</a>
          <a class="btn btn-outline-primary rounded-pill px-4" href="https://www.apple.com/iphone-air/">Tìm hiểu thêm</a>
        </div>
        <img class="img-fluid" src="https://www.apple.com/v/iphone/home/ck/images/overview/select/iphone_air__b5qmgl05ojyq_large.jpg" alt="iPhone Air màu xanh với mặt trước và mặt sau">
      </div>
    </section>
    <section id="features" class="container py-5">
      <h2 class="text-center fw-bold mb-5">Khám phá iPhone Air</h2>
      <div class="row g-4">
        <div class="col-md-4"><article class="h-100 bg-light rounded-4 p-4 text-center"><i class="fa-solid fa-mobile-screen-button fs-1 mb-3" aria-hidden="true"></i><h3 class="h4">Thiết kế</h3><p class="mb-0">Mỏng và nhẹ, thuận tiện khi cầm trên tay.</p></article></div>
        <div class="col-md-4"><article class="h-100 bg-light rounded-4 p-4 text-center"><i class="fa-solid fa-camera fs-1 mb-3" aria-hidden="true"></i><h3 class="h4">Camera</h3><p class="mb-0">Ghi lại hình ảnh và video trong cuộc sống hằng ngày.</p></article></div>
        <div class="col-md-4"><article class="h-100 bg-light rounded-4 p-4 text-center"><i class="fa-solid fa-microchip fs-1 mb-3" aria-hidden="true"></i><h3 class="h4">Hiệu năng</h3><p class="mb-0">Hiệu năng mạnh mẽ trong một thiết kế gọn nhẹ.</p></article></div>
      </div>
    </section>
  </main>
</body>
</html>
