<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid-template-columns</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Ví dụ 1: Tạo 3 cột có kích thước bằng nhau</h2>
  <div class="grid-container equal">
    <div>Ô 1</div><div>Ô 2</div><div>Ô 3</div>
    <div>Ô 4</div><div>Ô 5</div><div>Ô 6</div>
  </div>
  <h2>Ví dụ 2: Tạo các cột có kích thước khác nhau</h2>
  <div class="grid-container different">
    <div>Cột 1</div><div>Cột 2</div><div>Cột 3</div>
    <div>Cột 1</div><div>Cột 2</div><div>Cột 3</div>
  </div>
</body>
</html>
