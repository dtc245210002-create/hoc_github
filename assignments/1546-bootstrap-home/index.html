<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Trang Chủ với Bootstrap</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark"><div class="container">
    <a class="navbar-brand" href="#"><i class="fas fa-home" aria-hidden="true"></i> MyWebsite</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav"><ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li><li class="nav-item"><a class="nav-link" href="#">About</a></li><li class="nav-item"><a class="nav-link" href="#">Services</a></li><li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
    </ul></div>
  </div></nav>
  <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active"><img src="https://demo.codegym.vn/web/15/gallery/img_fjords.jpg" class="d-block w-100" alt="Slide 1"></div>
      <div class="carousel-item"><img src="https://demo.codegym.vn/web/15/gallery/img_forest.jpg" class="d-block w-100" alt="Slide 2"></div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev" aria-label="Slide trước"><span class="carousel-control-prev-icon" aria-hidden="true"></span></button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next" aria-label="Slide tiếp"><span class="carousel-control-next-icon" aria-hidden="true"></span></button>
  </div>
  <div class="d-flex justify-content-center align-items-center bg-light py-5"><h2>Chào mừng đến với trang web của chúng tôi!</h2></div>
  <form class="container mt-4" id="contact">
    <div class="mb-3"><label for="name" class="form-label">Tên của bạn</label><input type="text" class="form-control" id="name" name="name" placeholder="Nhập tên"></div>
    <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" class="form-control" id="email" name="email" placeholder="Nhập email"></div>
    <button type="submit" class="btn btn-primary">Gửi</button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
