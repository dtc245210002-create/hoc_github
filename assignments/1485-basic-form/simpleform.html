<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Order Form</title><style>.wufoo{font-family:"Lucida Grande","Lucida Sans Unicode",Tahoma,sans-serif}</style></head><body>
<form method="get" action="simpleform.html" class="wufoo">
<h2>Order Form</h2><p>What would you like to buy?</p><select aria-label="What would you like to buy?"><option value=" ">A</option><option>B (+ 0.5$)</option><option>C (+ 0.5$)</option></select>
<p>How many would you like to order?</p><label><input type="radio" name="rd"> 1 - $10</label><br><label><input type="radio" name="rd"> 2 - $20</label><br><label><input type="radio" name="rd"> 3 - $25</label><br>
<p>Name <span style="color:red">*</span></p><input type="text" name="firstname" placeholder="FirstName" size="15"><input type="text" name="lastname" placeholder="LastName" size="15">
<p>Email</p><input type="text" name="email" size="35" aria-label="Email">
<p>Phone Number</p><input type="text" name="phone1" size="5" aria-label="Phone Number 1"> - <input type="text" name="phone2" size="5" aria-label="Phone Number 2"> - <input type="text" name="phone3" size="5" aria-label="Phone Number 3">
<p><input type="button" name="btSubmit" value="Submit"></p>
</form></body></html>
