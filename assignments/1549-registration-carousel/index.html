<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng Ký Người Dùng</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body>
  <main class="container py-5"><div class="row align-items-center g-4">
    <div class="col-lg-6">
      <div id="benefits" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active"><img src="website.svg" class="d-block w-100" alt="Giao diện responsive"><div class="carousel-caption bg-dark bg-opacity-75"><h2 class="h4">Giao diện responsive</h2><p>Hiển thị trên máy tính và điện thoại.</p></div></div>
          <div class="carousel-item"><img src="website.svg" class="d-block w-100" alt="Thao tác rõ ràng"><div class="carousel-caption bg-dark bg-opacity-75"><h2 class="h4">Thao tác rõ ràng</h2><p>Nội dung được bố trí theo từng phần.</p></div></div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#benefits" data-bs-slide="prev" aria-label="Lợi ích trước"><span class="carousel-control-prev-icon" aria-hidden="true"></span></button>
        <button class="carousel-control-next" type="button" data-bs-target="#benefits" data-bs-slide="next" aria-label="Lợi ích tiếp"><span class="carousel-control-next-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="col-lg-6">
      <h1 class="text-center mb-4">Đăng ký</h1>
      <form method="post">
        <div class="mb-3"><label class="form-label" for="fullname">Họ tên</label><input class="form-control" id="fullname" name="fullname" autocomplete="name" required></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label><div class="input-group"><span class="input-group-text" aria-hidden="true">@</span><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div></div>
        <div class="mb-3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required></div>
        <div class="mb-3"><label class="form-label" for="confirm-password">Xác nhận mật khẩu</label><input class="form-control" id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required></div>
        <button class="btn btn-primary w-100" type="submit">Đăng ký</button>
      </form>
    </div>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
