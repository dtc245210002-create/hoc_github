<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>flex-basis</title><link rel="stylesheet" href="style.css"></head>
<body>
<h2>Ví dụ 1: px</h2>
<div class="container pixels"><div class="item item1">Item 1</div><div class="item item2">Item 2</div><div class="item item3">Item 3</div></div>
<h2>Ví dụ 2: flex-direction: column</h2>
<div class="container column"><div class="item item1">Item 1</div><div class="item item2">Item 2</div><div class="item item3">Item 3</div></div>
<h2>Ví dụ 3: %</h2>
<div class="container percentage"><div class="item item1">Item 1</div><div class="item item2">Item 2</div></div>
<h2>Ví dụ 4: flex-basis và flex-grow</h2>
<div class="container grow"><div class="item item1">Item 1</div><div class="item item2">Item 2</div><div class="item item3">Item 3</div></div>
<h2>auto</h2>
<div class="container auto"><div class="item item1">Item 1</div></div>
<h2>initial</h2>
<div class="container initial"><div class="item item1">Item 1</div></div>
<h2>inherit</h2>
<div class="container inherit"><div class="item item1">Item 1</div></div>
</body>
</html>
